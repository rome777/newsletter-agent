# 타깃 독자, 중요도 기준, 제외 조건 — graph.py 가 읽는다.
# 기준을 바꿀 때는 이 파일만 고치면 된다. 코드는 열지 않아도 된다.

field: AI 기술 소식
reader: AI를 실제 제품에 붙이는 국내 개발팀
persona: >-
  LLM API를 서비스에 붙여 운영하는 5~10명 규모 개발팀의 백엔드·ML 엔지니어.
  출근길 5분 안에 오늘 확인할 것만 알고 싶다. 영어 기사도 읽지만 요약은 한국어로 받고 싶다.
  투자·행사 소식보다 지금 쓰는 모델·API·도구가 바뀌었는지가 궁금하다.

# 중요도 판단 문장 — 선별 프롬프트 맨 앞에 그대로 들어간다
criteria:
  - 이번 주 일하는 방식이 바뀔 만한가
  - 지금 쓰는 도구·API의 가격·한도·정책이 실제로 변했나
reject:
  - 발표 예정·로드맵·예고만 있고 지금 쓸 수 있는 게 없는 소식
  - 투자 유치·펀딩·기업 가치·MOU·제휴 체결·수상 같은 홍보성 소식
notes: 독자는 영어 기사도 읽습니다. 기사 언어나 국내 회사 여부는 판단 기준이 아닙니다.

# 모델이 붙인 성격(kind)이 이 중 하나면 프롬프트 부탁과 별개로 코드에서 버린다
drop_kinds: [로드맵·예고, 투자·MOU·수상]

# 제목만 봐도 홍보성인 기사 — LLM 에 넘기기 전에 거른다 (대소문자 무시 정규식)
promo_title_patterns:
  - '\braises? \$'
  - '\bseries [a-f]\b'
  - '\bfunding\b'
  - '\bseed round\b'
  - '\bvaluation\b'
  - '\bunicorn\b'
  - '\bmou\b'
  - '\bwins?\b.*\baward'
  - '투자\s?유치'
  - '시리즈\s?[a-f]\b'
  - '펀딩'
  - '기업\s?가치'
  - '업무\s?협약'
  - '협약\s?체결'
  - '수상'
  - '시상'
  - '조달'
  - '금융\s?지원'
  - '^\[게시판\]'

# 과제가 제외한 소스. 이 도메인의 기사는 피드로든 Hacker News 링크로든 들어오면 버린다
excluded_domains:
  - openai.com            # OpenAI
  - deepmind.google       # DeepMind
  - techcrunch.com        # TechCrunch
  - theverge.com          # The Verge
  - technologyreview.com  # MIT Technology Review
  - aitimes.com           # AI타임스 (aitimes.kr 인공지능신문과는 다른 매체)

target: 5           # 하루에 보낼 기사 수 (과제 기준 3~5건)
spare: 3            # 검수에서 빠질 때 채울 예비
max_per_source: 2   # 한 매체가 브리핑을 독차지하지 않게
