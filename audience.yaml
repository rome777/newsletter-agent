# 타깃 독자, 중요도 기준, 제외 조건 — graph.py 가 읽는다.
# 기준을 바꿀 때는 이 파일만 고치면 된다. 코드는 열지 않아도 된다.

field: 해외 기묘한 뉴스
reader: 점심시간에 가볍게 읽을거리를 찾는 국내 20~30대 직장인
persona: >-
  점심시간이나 퇴근길 5분 동안 가볍게 읽을 이야기를 찾는 20~30대 직장인.
  정치·경제 뉴스는 피곤하고, 동료나 친구에게 "이거 봤어?" 하고 꺼낼 만한 해외 이야기를 원한다.
  황당한 사건 사고, 연예인 이야기, 운세처럼 화제가 되는 이야기도 좋아한다.
  영어 기사는 잘 안 읽어서 요약은 한국어로 받고 싶다. 지어낸 이야기나 낚시 기사는 싫다.

# 중요도 판단 문장 — 선별 프롬프트 맨 앞에 그대로 들어간다
criteria:
  - 실제로 일어난 일인데 처음 들으면 "진짜?" 소리가 나오는가
  - 웃기거나 신기하거나 오싹하거나 훈훈해서 남에게 말해 주고 싶은가
  - 누가, 어디서, 무엇을 했는지 기사에 분명히 나오는가
reject:
  - 정치·전쟁·재난·경제, 기업 발표·기술 소식, 인터뷰·조언, 쇼핑·할인 광고 같은 일반 뉴스
  - 출처가 불분명한 소문, 풍자 기사, SNS 글 하나만 옮긴 기사
  - 한국 국내에서 일어난 일
notes: 기사 언어는 판단 기준이 아닙니다. 어느 나라 이야기든 한국 밖에서 일어난 일이면 됩니다.

# 모델이 붙인 성격(kind)이 이 중 하나면 프롬프트 부탁과 별개로 코드에서 버린다
drop_kinds: [일반 뉴스]   # 비극·범죄, 연예·운세도 처음엔 버렸으나 독자가 흥미로워하는 이야기라 남긴다

# 제목만 봐도 퍼즐·광고인 기사 — LLM 에 넘기기 전에 거른다 (대소문자 무시 정규식)
promo_title_patterns:
  - '\bquiz\b'
  - '\bcrossword\b'
  - '\bwordle\b'
  - '\bconnections (hints?|answers?)\b'
  - '\bdeals?\b'
  - '\b\d+% off\b'
  - '\bgiveaway\b'
  - '\bsponsored\b'
  - '할인'
  # 'horoscope'·'운세'는 연예·운세 라벨로 남기려고 뺐다
  # 'coupon'·'쿠폰'은 넣었다가 뺐다 — "경품 쿠폰으로 SUV 당첨" 같은 기묘한 기사가 LLM 에 닿기도 전에 빠졌다
  - '^\[(포토|영상|쇼츠)\]'

# 과제가 제외한 소스. 이 도메인의 기사는 어느 경로로든 들어오면 버린다
excluded_domains:
  - openai.com            # OpenAI
  - deepmind.google       # DeepMind
  - techcrunch.com        # TechCrunch
  - theverge.com          # The Verge
  - technologyreview.com  # MIT Technology Review
  - aitimes.com           # AI타임스 (aitimes.kr 인공지능신문과는 다른 매체)

target: 5           # 하루에 보낼 기사 수 (과제 기준 3~5건)
spare: 3            # 검수에서 빠질 때 채울 예비
max_per_source: 2   # 한 매체가 브리핑을 독차지하지 않게
max_per_country: 2  # 한 나라 이야기로 도배되지 않게 (인도 매체가 두 곳이라 매체 상한만으로는 4건까지 가능)
