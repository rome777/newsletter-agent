name: 매일 브리핑

on:
  schedule:                      # ① GitHub 는 몇 시간씩 늦게 시작하기도 해서 일찍 세 번 건다.
    - cron: "47 21 * * *"       #    UTC 21:47 = KST 06:47   붐비는 정각·30분은 피한다
    - cron: "7 22 * * *"        #    UTC 22:07 = KST 07:07
    - cron: "27 22 * * *"       #    UTC 22:27 = KST 07:27   먼저 돈 한 번만 보내고 나머지는 건너뛴다
  workflow_dispatch:            # ② 손으로도 돌릴 수 있게
    inputs:
      dry_run:
        description: "발행하지 않고 로그만 남기기"
        type: boolean
        default: false

concurrency:                     # 늦게 몰려 시작해도 하나씩 — 뒤 실행이 앞 실행의 last_sent.txt 를 본다
  group: daily-briefing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # ③ 멈춰 있는 실행을 20분에서 끊는다
    permissions:
      contents: write            # 아래 두 단계가 history.json·빈 커밋을 올린다
    env:
      GIT_AUTHOR_NAME:     github-actions[bot]
      GIT_AUTHOR_EMAIL:    41898282+github-actions[bot]@users.noreply.github.com
      GIT_COMMITTER_NAME:  github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main              # 예약된 시점이 아니라 지금의 main — 앞 실행이 커밋한 last_sent.txt 까지 받는다
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - run: pip install -r requirements.lock   # 로컬에서 돌려 본 버전 그대로

      - name: 브리핑 생성·발행
        run: python run.py ${{ github.event_name == 'schedule' && '--once' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:                     # ④ 비밀값은 여기로만 들어간다
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: Asia/Seoul
          DRY_RUN: "0"             # ⑤ 이 줄이 없으면 Actions에서는 한 번도 안 보낸다

      - name: 선별 기록 남기기       # 실행 환경은 끝나면 사라지니 runs/ 를 밖으로 내보낸다 (39장)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: runs/
          retention-days: 90

      - name: 실행·발행 기록 커밋     # 보낸 기사(다음 날 중복 거르기)와 실행 지표를 저장소에 남긴다
        run: |
          git add history.json last_sent.txt store/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "남길 기록 없음 — 할 일 없음"
          else
            git commit -m "history: $(TZ=Asia/Seoul date +%F) 실행 기록"
            git pull --rebase --quiet      # 실행 중에 다른 커밋이 올라왔어도 밀어 넣을 수 있게
            git push
          fi

      - name: 60일 정지 막기         # 공개 저장소는 60일 동안 커밋이 없으면 schedule 을 끈다
        if: always()
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $(( 50 * 86400 )) ]; then
            git commit --allow-empty -m "keepalive: 마지막 커밋 뒤 50일이 지나 예약 실행을 유지한다"
            git push
          else
            echo "마지막 커밋 $(( age / 86400 ))일 전 — 할 일 없음"
          fi
