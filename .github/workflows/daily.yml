name: 매일 브리핑

on:
  schedule:
    - cron: "30 22 * * *"       # ① UTC 22:30 = KST 07:30
  workflow_dispatch:             # ② 손으로도 돌릴 수 있게
    inputs:
      dry_run:
        description: "발행하지 않고 로그만 남기기"
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20          # ③ 멈춰 있는 실행을 20분에서 끊는다
    permissions:
      contents: write            # 아래 '60일 정지 막기'가 빈 커밋을 올린다

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 브리핑 생성·발행
        run: python run.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:                     # ④ 비밀값은 여기로만 들어간다
          OPENAI_API_KEY:      ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TZ: Asia/Seoul
          DRY_RUN: "0"             # ⑤ 이 줄이 없으면 Actions에서는 한 번도 안 보낸다

      - name: 선별 기록 남기기       # 실행 환경은 끝나면 사라지니 runs/ 를 밖으로 내보낸다 (39장)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}
          path: runs/
          retention-days: 90

      - name: 60일 정지 막기         # 공개 저장소는 60일 동안 커밋이 없으면 schedule 을 끈다
        if: always()
        run: |
          age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
          if [ "$age" -gt $(( 50 * 86400 )) ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: 마지막 커밋 뒤 50일이 지나 예약 실행을 유지한다"
            git push
          else
            echo "마지막 커밋 $(( age / 86400 ))일 전 — 할 일 없음"
          fi
